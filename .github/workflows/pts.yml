name: pts

on:
  schedule:
    # JST平日 17:45 / 20:00 / 23:00(UTCでは同日の 08:45 / 11:00 / 14:00)
    - cron: "45 8 * * 1-5"
    - cron: "0 11 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: pts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存インストール
        run: pip install --quiet -r requirements.txt
      - name: 突合・通知
        env:
          DISCORD_WEBHOOK_URL_PTS: ${{ secrets.DISCORD_WEBHOOK_URL_PTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m collector.pts_run
      - name: データをcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # EDINET収集の途中結果を巻き込まないようパスを限定する
          git add data/pts_alerts data/pts_snapshots
          if ! git diff --cached --quiet; then
            git commit -m "PTS突合結果 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST)"
            git pull --rebase origin master
            git push
          else
            echo "新着なし"
          fi
